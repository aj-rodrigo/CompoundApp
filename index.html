/* ================= live prices (Finnhub) ================= */
function quoteSymbol(h, a) {
  const t = String(h.ticker || '').trim().toUpperCase();
  if (!t) return null;
  if (t.includes(':')) return t;
  if (/\s/.test(t)) return null;
  if (a && a.type === 'crypto') return 'BINANCE:' + t.replace(/[-/]?USDT?$/, '') + 'USDT';
  return t;
}
const isLive = h => !h.manualPrice && h.quoteAt && Date.now() - h.quoteAt < 5 * 864e5;
async function fetchQuote(sym, key) {
  const r = await fetch('https://finnhub.io/api/v1/quote?symbol=' + encodeURIComponent(sym) + '&token=' + encodeURIComponent(key));
  const fail = code => Object.assign(new Error(code), { code });
  if (r.status === 401) throw fail('key');
  if (r.status === 403) return { denied: true };
  if (r.status === 429) throw fail('limit');
  if (!r.ok) throw fail('http');
  const j = await r.json();
  return j && j.c > 0 ? { c: j.c, d: j.d || 0, dp: j.dp || 0, t: (j.t || 0) * 1000 || Date.now() } : null;
}
let quoting = false;
async function refreshQuotes(opts = {}) {
  const key = String(S.settings.quoteKey || '').trim();
  if (!key) { if (!opts.silent) toast('Add your free Finnhub key in Settings, under Live prices'); return; }
  if (quoting) return;
  const map = new Map();
  S.accounts.forEach(a => (a.holdings || []).forEach(h => { if (h.manualPrice) return; const s = quoteSymbol(h, a); if (!s) return; if (!map.has(s)) map.set(s, []); map.get(s).push({ a, h }); }));
  if (!map.size) { if (!opts.silent) toast('Add holdings with tickers to get live prices'); return; }
  quoting = true; if (!opts.silent) toast('Updating prices\u2026');
  const syms = [...map.keys()], miss = [], denied = [], touched = new Set(); let ok = 0, err = null;
  try {
    for (let i = 0; i < syms.length; i += 5) {
      if (i && syms.length > 50) await new Promise(r => setTimeout(r, 5500));
      const batch = syms.slice(i, i + 5), res = await Promise.allSettled(batch.map(s => fetchQuote(s, key)));
      res.forEach((r, j) => {
        const s = batch[j];
        if (r.status === 'rejected') { err = err || r.reason; miss.push(s); return; }
        if (!r.value) { miss.push(s); return; }
        if (r.value.denied) { miss.push(s); denied.push(s); return; }
        ok++;
        map.get(s).forEach(({ a, h }) => { h.price = r.value.c; h.dayChg = r.value.d; h.dayPct = r.value.dp; h.quoteAt = r.value.t; touched.add(a); });
      });
      if (err && (err.code === 'key' || err.code === 'limit')) break;
    }
  } finally { quoting = false; }
  touched.forEach(a => { a.updated = todayISO(); });
  if (ok) S.settings.lastQuote = Date.now();
  commit();
  const code = err && err.code;
  if (code === 'key' || (!ok && denied.length && denied.length === syms.length)) return toast(code === 'key' ? 'Finnhub says the key is invalid (error 401). Re-copy it from your Finnhub dashboard.' : 'Finnhub refused every ticker (error 403). The key may be wrong, or these holdings aren\u2019t on the free plan.');
  if (code === 'limit') return toast('Finnhub\u2019s rate limit was reached. Try again in a minute.');
  if (err && !ok) return toast('Couldn\u2019t reach Finnhub. Check your connection and try again.');
  if (opts.silent && !miss.length) return;
  const m = miss.filter(s => !s.startsWith('BINANCE:')).concat(miss.filter(s => s.startsWith('BINANCE:')).map(s => s.slice(8).replace(/USDT$/, '')));
  toast(`Updated ${ok} price${ok === 1 ? '' : 's'}` + (m.length ? `. No live price for ${m.slice(0, 3).join(', ')}${m.length > 3 ? ' and ' + (m.length - 3) + ' more' : ''}; ${m.length === 1 ? 'it keeps' : 'they keep'} the price you entered.` : ''));
}
function dayChange(accts) {
  let chg = 0, base = 0, n = 0;
  accts.forEach(a => (a.holdings || []).forEach(h => { if (!isLive(h)) return; const sh = num(h.shares); chg += sh * num(h.dayChg); base += sh * (num(h.price) - num(h.dayChg)); n++; }));
  return n ? { chg, pct: base ? chg / base : 0 } : null;
}
function quoteAsOf() {
  const t = S.settings.lastQuote; if (!t) return '';
  const d = new Date(t), today = iso(d) === todayISO();
  return 'Prices as of ' + (today ? '' : fmtShort(d) + ', ') + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

function parseCsv(text) {

    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }

function parseDateLoose(s) {

}

    title: 'Import bank CSV', intro: 'Download transactions as a CSV from your bank\u2019s website, then choose the file here. Duplicates are skipped, and transactions you\u2019ve categorized before are matched automatically.', fields: [
      { k: 'file', label: 'CSV file', type: 'file', accept: '.csv,text/csv' },
      { k: 'sign', label: 'In this file, spending shows as', type: 'select', opts: [['neg', 'Negative numbers (most banks)'], ['pos', 'Positive numbers (most credit cards)']], v: 'neg' }

        const di = f(/date/), ni = f(/desc|name|memo|payee|detail|merchant/), ai = f(/^amount|amount/), dbi = f(/debit|withdraw/), cri = f(/credit|deposit/);

async function hashPin(p) {
  const s = 'compound:' + p;
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch (e) { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) | 0; return 'w' + h; }
}

  scnCmp: t => { const s = byId(S.scenarios, t.dataset.id); if (s) { s.cmp = t.checked; save(); renderProj(); } },
  extraDone: () => { save(); },
  refiPick: t => { const d = byId(S.debts, t.value); if (!d) return; const r = S.settings.refi; r.bal = num(d.balance); r.apr = num(d.apr); const rr = num(d.apr) / 1200, p = num(d.min); r.months = p > d.balance * rr ? Math.ceil(rr ? -Math.log(1 - d.balance * rr / p) / Math.log(1 + rr) : d.balance / p) : 360; save(); render(); }
};
const INP = {
  raise: t => { UI.raise = +t.value; renderRaise(); },
  extra: t => { S.settings.extra = +t.value; renderDebt(); },
  search: t => runSearch(t.value)
};
function bindEvents() {

      if (t.dataset.bind === 'settings.theme') applyTheme();
      if (t.closest('#sheets')) { save(); render(); return; }

  let sx = 0, sy = 0;
  $('#main').addEventListener('touchstart', e => { const s = e.target.closest('.swipe'); if (!s) { sx = null; return; } sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  $('#main').addEventListener('touchend', e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) { UI.pOff += dx < 0 ? 1 : -1; render(); } sx = null; }, { passive: true });

      if (runBills()) commit();

}
async function init() {
  S = merge(await Store.load());

  if (!S.onboarded) onboard();

  if (S.onboarded && S.settings.quoteKey && S.settings.autoQuotes) refreshQuotes({ silent: true });
}
init();

</script>

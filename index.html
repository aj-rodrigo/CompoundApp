<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Compound</title>
<style>
:root{--r-lg:22px;--r:16px;--r-sm:11px;--gap:12px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,sans-serif;-webkit-text-size-adjust:100%}
[data-theme=dark]{--bg:#0C1522;--surf:#142033;--surf2:#1B2A42;--line:#26385A;--text:#E4EBF5;--mute:#8898B3;--acc:#5B9BFF;--acc-ink:#07162E;--pos:#3DBEA8;--neg:#F0A541;--shadow:0 8px 22px rgba(2,7,18,.42);--c1:#5B9BFF;--c2:#3DBEA8;--c3:#9A8CF5;--c4:#F0A541;--c5:#56C7F0;--c6:#E07A9B;--c7:#7F93B0;color-scheme:dark}
[data-theme=light]{--bg:#EEF2F8;--surf:#FFFFFF;--surf2:#F2F5FA;--line:#DCE3EE;--text:#122037;--mute:#5E6E88;--acc:#1D6AE5;--acc-ink:#FFFFFF;--pos:#138A77;--neg:#B8700C;--shadow:0 1px 2px rgba(18,32,55,.06),0 8px 22px rgba(18,32,55,.08);--c1:#1D6AE5;--c2:#139C87;--c3:#7A68E8;--c4:#D98A1E;--c5:#2BA3D6;--c6:#CC5A80;--c7:#8494AB;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.35}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#main{padding:calc(env(safe-area-inset-top) + 6px) 14px calc(100px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:12px 2px 14px}
.top h1{font-size:30px;font-weight:700;letter-spacing:-.022em;margin:0}
.top-act{display:flex;gap:7px;align-items:center}
.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surf);box-shadow:var(--shadow);flex:none;color:var(--text)}
.ib svg{width:18px;height:18px}
svg.i{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stack{display:flex;flex-direction:column;gap:var(--gap)}
.card{background:var(--surf);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.card.hero{border-radius:var(--r-lg);padding:18px}
.card h2{font-size:15px;font-weight:650;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;letter-spacing:-.005em}
.card h2 small{font-weight:450;color:var(--mute);font-size:12.5px}
.mute{color:var(--mute)}.pos{color:var(--pos)}.neg{color:var(--neg)}.sm{font-size:13.5px}.xs{font-size:12px}
.big{font-size:40px;font-weight:700;letter-spacing:-.035em;line-height:1.08}
.mid{font-size:22px;font-weight:650;letter-spacing:-.015em}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2 .fld,.grid3 .fld{margin-bottom:4px}
.stat{background:var(--surf2);border-radius:var(--r-sm);padding:9px 10px;min-width:0}
.stat .l{font-size:12px;color:var(--mute)}.stat .v{font-size:16px;font-weight:650;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.list>.li:first-child{border-top:0}
.li .ic{width:32px;height:32px;border-radius:10px;background:var(--surf2);display:grid;place-items:center;flex:none;color:var(--acc)}
.li .ic svg{width:17px;height:17px}
.li .main{flex:1;min-width:0;display:flex;flex-direction:column}
.li .t{font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12.5px;color:var(--mute)}
.li .amt{text-align:right;font-weight:620;white-space:nowrap}
.bar{height:8px;border-radius:5px;background:var(--surf2);position:relative}
[data-theme=light] .bar{background:#E3E9F2}
.bar>i{display:block;height:100%;border-radius:5px;background:var(--acc);max-width:100%}
.bar>b{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:1px;background:var(--text);opacity:.55;transform:translateX(-1px)}
.stackbar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px}
.stackbar i{display:block;height:100%}
.seg{display:flex;background:var(--surf2);border-radius:10px;padding:3px;gap:2px}
[data-theme=light] .seg{background:#E3E9F2}
.seg button{flex:1;padding:7px 10px;border-radius:8px;font-size:13px;font-weight:560;color:var(--mute);white-space:nowrap}
.seg button.on{background:var(--surf);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.segwrap{overflow-x:auto;margin:0 -14px 12px;padding:0 14px;scrollbar-width:none}
.segwrap::-webkit-scrollbar{display:none}
.segwrap .seg{min-width:max-content}
.chip{padding:6px 12px;border-radius:999px;background:var(--surf);box-shadow:var(--shadow);font-size:13px;font-weight:600;color:var(--acc);white-space:nowrap}
.sheet .chip{box-shadow:none;background:var(--surf2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;background:var(--acc);color:var(--acc-ink);font-weight:620;font-size:15px}
.btn.ghost{background:var(--surf2);color:var(--text)}
.sheet .btn.ghost{background:var(--surf)}
.btn.danger{background:transparent;color:var(--neg)}
.btn.block{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:6px;background:var(--surf2);color:var(--mute);font-weight:560}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;top:-6px;left:50%;pointer-events:none;background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:12px;white-space:nowrap;box-shadow:var(--shadow);transform:translate(-50%,-100%);opacity:0;transition:opacity .12s;z-index:3}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.axis{fill:var(--mute);font-size:10px}
.gridl{stroke:var(--line);stroke-width:1}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}}
.pop{animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{transform:scale(.85) rotate(-20deg);opacity:0}}
.fadein{animation:fi .6s ease-out both}
@keyframes fi{from{opacity:0}}
.empty{padding:18px 6px;text-align:center;color:var(--mute);font-size:14px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.card h2+.alert{border-top:0}
.alert .dot{width:8px;height:8px;border-radius:50%;background:var(--neg);margin-top:6px;flex:none}
.alert .dot.info{background:var(--acc)}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:6px 8px calc(4px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--surf) 86%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line);z-index:20}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:560;color:var(--mute);padding:4px 10px;min-width:64px}
#tabs button svg{width:24px;height:24px}
#tabs button.on{color:var(--acc)}
#fab{position:fixed;right:18px;bottom:calc(74px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;box-shadow:0 10px 26px rgba(20,70,160,.45);z-index:21}
#fab svg{width:26px;height:26px;stroke-width:2.3}
.ov{position:fixed;inset:0;background:rgba(3,8,18,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fi .2s}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:22px 22px 0 0;padding:6px 16px calc(22px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40%);opacity:.3}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sh-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.sh-h h3{margin:0;font-size:20px;letter-spacing:-.015em}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fld label{font-size:13px;color:var(--mute);font-weight:560}
.fld input,.fld select,.fld textarea{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--surf);font-size:16px;min-height:44px;-webkit-appearance:none;appearance:none}
.card .fld input,.card .fld select{background:var(--surf2)}
.fld select{background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.fld input[type=file]{padding:9px;font-size:14px}
.fld .other-in{margin-top:6px}
.fld .hint{font-size:12px;color:var(--mute)}
.tgl{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;margin-bottom:6px}
.tgl label{font-size:15px}
.sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:background .2s;flex:none;margin:0;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw:checked{background:var(--pos)}
.sw:checked::after{transform:translateX(20px)}
input[type=range]{width:100%;accent-color:var(--acc);margin:12px 0 6px}
.swipe{display:flex;flex-direction:column;gap:var(--gap)}
.swipe>.pnav{margin-bottom:0}
.grid3 .stat .v{font-size:14.5px}
.pnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.pnav .lbl{font-weight:650;font-size:16px}
.thumb{width:36px;height:36px;border-radius:8px;object-fit:cover;flex:none}
.ring-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px 10px;text-align:center}
.ring-grid.solo{grid-template-columns:auto;justify-content:start;flex:none}
.ladder .step{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.ladder .step:first-child{border-top:0}
.ladder .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--surf2);color:var(--mute);flex:none}
.ladder .done .n{background:var(--pos);color:var(--acc-ink)}
.ladder .done{opacity:.72}
.ladder .cur .n{background:var(--acc);color:var(--acc-ink)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp>div{background:var(--surf2);border-radius:var(--r-sm);padding:12px}
.cmp .win{box-shadow:inset 0 0 0 2px var(--pos)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl td,.tbl th{padding:7px 4px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.tbl tr:first-child th,.tbl tr:first-child td{border-top:0}
.tbl th{color:var(--mute);font-weight:560;font-size:12.5px}
.tbl .r{text-align:right;white-space:nowrap}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.icons button{height:42px;border-radius:10px;background:var(--surf);border:1px solid var(--line);display:grid;place-items:center;color:var(--mute)}
.icons button.on{border-color:var(--acc);color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.icons svg{width:19px;height:19px}
.w-edit .btns{flex-wrap:nowrap}
.w-edit .btns button{width:36px;height:36px;border-radius:10px;background:var(--surf2);display:grid;place-items:center}
.w-edit .btns svg{width:17px;height:17px}
#lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding-bottom:env(safe-area-inset-bottom)}
#lock[hidden]{display:none}
.dots{display:flex;gap:16px}
.dots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--mute)}
.dots i.f{background:var(--text);border-color:var(--text)}
.keys{display:grid;grid-template-columns:repeat(3,74px);gap:16px 22px;margin-top:10px}
.keys button{height:74px;border-radius:50%;background:var(--surf);font-size:28px;font-weight:450;box-shadow:var(--shadow)}
.keys button:active{background:var(--surf2)}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
#toast{position:fixed;left:50%;bottom:calc(142px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:560;opacity:0;pointer-events:none;transition:opacity .2s;z-index:200;width:max-content;max-width:88vw;text-align:center}
#toast.on{opacity:1}
.chk-row .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-weight:800;font-size:14px;color:var(--acc-ink)}
.chk-row.done .box{background:var(--pos);border-color:var(--pos)}
.chk-row.done .t{text-decoration:line-through;color:var(--mute)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.wk span{height:34px;border-radius:9px;background:var(--surf2);display:grid;place-items:center;font-size:12px;font-weight:650;color:var(--mute)}
.wk span.ok{background:var(--pos);color:var(--acc-ink)}
.wk span.pre{opacity:.35}
.qa-amt{display:flex;align-items:center;justify-content:center;gap:4px;margin:4px 0 14px}
.qa-amt span{font-size:34px;font-weight:700;color:var(--mute)}
.qa-amt input{font-size:44px;font-weight:750;letter-spacing:-.03em;width:62%;background:transparent;border:0;outline:none;color:var(--text);text-align:left}
.qa-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.qa-chips::-webkit-scrollbar{display:none}
.qa-chips .chip{box-shadow:none;background:var(--surf);color:var(--text);font-weight:560}
.qa-cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa-cats button{background:var(--surf);border-radius:14px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--text);border:1.5px solid transparent;min-height:74px}
.qa-cats button svg{width:22px;height:22px;color:var(--acc)}
.qa-cats button.on{border-color:var(--acc)}
.qa-cats button:active{background:var(--surf2)}
.dotc{width:12px;height:12px;border-radius:4px;flex:none}
#toast.act{pointer-events:auto;display:flex;align-items:center;gap:16px;text-align:left}
#toast.act button{color:inherit;font-weight:750;text-decoration:underline;text-underline-offset:3px;padding:4px 2px;flex:none}
#upd{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 8px);z-index:150;background:var(--acc);color:var(--acc-ink);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;box-shadow:0 10px 26px rgba(10,40,100,.45);max-width:696px;margin:0 auto}
#upd[hidden]{display:none}
#upd span{flex:1}
#upd button{background:var(--acc-ink);color:var(--acc);border-radius:10px;padding:7px 12px;font-weight:700}
#upd button.x{background:transparent;color:var(--acc-ink);padding:6px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calgrid .cw{font-size:11px;color:var(--mute);text-align:center;font-weight:600;padding-bottom:2px}
.cd{min-height:54px;border-radius:9px;background:var(--surf2);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 1px 3px;gap:2px;border:1.5px solid transparent}
[data-theme=light] .cd{background:#EEF2F8}
.cd .n{font-size:12.5px;font-weight:600}
.cd.today .n{color:var(--acc)}
.cd.on{border-color:var(--acc)}
.cd .dots{display:flex;gap:2px;height:6px}
.cd .dots i,.legend i.dt-pay,.legend i.dt-bill,.legend i.dt-card,.legend i.dt-cardsub{width:6px;height:6px;border-radius:50%;display:block}
.dt-pay{background:var(--pos)}.dt-bill{background:var(--neg)}.dt-card{background:var(--c3)}.dt-cardsub{background:var(--mute)}
.cd em{font-style:normal;font-size:9px;color:var(--mute);letter-spacing:-.02em}
.cd em.neg{color:var(--neg)}
#print{display:none}
@media print{#app,#sheets,#lock,#toast{display:none!important}html,body{background:#fff}#print{display:block;color:#000;font:12px -apple-system,system-ui,sans-serif}#print h1{font-size:20px}#print h2{font-size:15px;margin-top:18px}#print table{width:100%;border-collapse:collapse}#print td,#print th{border-bottom:1px solid #ccc;padding:4px;text-align:left}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.draw{stroke-dasharray:none}}
@media (max-width:360px){.big{font-size:34px}.grid3{grid-template-columns:1fr 1fr}.top h1{font-size:26px}}
</style>
</head>
<body>
<div id="app">
  <main id="main" aria-live="polite"></main>
  <button id="fab" data-act="fab" aria-label="Add"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14 M5 12h14"/></svg></button>
  <nav id="tabs" aria-label="Sections">
    <button data-tab="dash"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4z M13 4h7v4h-7z M13 10h7v10h-7z M4 13h7v7H4z"/></svg>Dashboard</button>
    <button data-tab="invest"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19l5-6 4 3 7-9 M15 7h5v5"/></svg>Invest</button>
    <button data-tab="budget"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M3 7l12-4 2 4 M16.5 13.5h.01"/></svg>Budget</button>
    <button data-tab="plan"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M12 12h.01"/></svg>Plan</button>
  </nav>
</div>
<div id="sheets"></div>
<div id="lock" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="print"></div>
<script>
'use strict';
/* ================= utilities ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sum = a => a.reduce((s, v) => s + (+v || 0), 0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const num = v => { if (typeof v === 'number') return isFinite(v) ? v : 0; const n = parseFloat(String(v ?? '').replace(/[$,%\s]/g, '')); return isFinite(n) ? n : 0; };

function bracketTax(t, br) {

  }
  return tax;
}
function calcPay(raisePct = 0, over = {}) {

  const G = num(p.salary) * (1 + raisePct / 100), n = +p.freq || 26;
  const k = G * num(p.k401) / 100, r = G * num(p.roth401) / 100;
  const h = num(p.hsa) * n, hi = num(p.health) * n, o = num(p.otherPre) * n;
  const fedTaxable = Math.max(0, G - k - h - hi - o - FED.std[f]);
  const fed = bracketTax(fedTaxable, FED.br[f]);
  const fw = Math.max(0, G - h - hi);
  const ss = .062 * Math.min(fw, FED.ssBase);
  const med = .0145 * fw + .009 * Math.max(0, fw - FED.addlMed[f]);

  const st = STATES[code];
  const hsaState = (code === 'CA' || code === 'NJ') ? 0 : h;
  const stTaxable = Math.max(0, G - k - hi - o - hsaState - st[1] * m);
  const stax = st[2].length ? bracketTax(stTaxable, st[2].map(([a, b]) => [a * m, b])) : 0;

  const net = G - pre - r - fed - ss - med - stax;

  const match = G * mp / 100;
  return { G, n, k, r, h, hi, o, pre, fed, ss, med, fica: ss + med, stax, net, match, eff: G ? (fed + ss + med + stax) / G : 0 };
}

function payoff(debts, extra, strat) {

function quoteSymbol(h, a) {
  const t = String(h.ticker || '').trim().toUpperCase();
  if (!t) return null;
  if (t.includes(':')) return t;
  if (/\s/.test(t)) return null;
  if (a && a.type === 'crypto') return 'BINANCE:' + t.replace(/[-/]?USDT?$/, '') + 'USDT';
  return t;
}
const isLive = h => !h.manualPrice && h.quoteAt && Date.now() - h.quoteAt < 5 * 864e5;
async function fetchQuote(sym, key) {
  const r = await fetch('https://finnhub.io/api/v1/quote?symbol=' + encodeURIComponent(sym) + '&token=' + encodeURIComponent(key));
  const fail = code => Object.assign(new Error(code), { code });
  if (r.status === 401) throw fail('key');
  if (r.status === 403) return { denied: true };
  if (r.status === 429) throw fail('limit');
  if (!r.ok) throw fail('http');

}
let quoting = false;
async function refreshQuotes(opts = {}) {
  const key = String(S.settings.quoteKey || '').trim();
  if (!key) { if (!opts.silent) toast('Add your free Finnhub key in Settings, under Live prices'); return; }
  if (quoting) return;
  const map = new Map();
  S.accounts.forEach(a => (a.holdings || []).forEach(h => { if (h.manualPrice) return; const s = quoteSymbol(h, a); if (!s) return; if (!map.has(s)) map.set(s, []); map.get(s).push({ a, h }); }));
  if (!map.size) { if (!opts.silent) toast('Add holdings with tickers to get live prices'); return; }
  quoting = true; if (!opts.silent) toast('Updating prices\u2026');
  const syms = [...map.keys()], miss = [], denied = [], touched = new Set(); let ok = 0, err = null;
  try {
    for (let i = 0; i < syms.length; i += 5) {
      if (i && syms.length > 50) await new Promise(r => setTimeout(r, 5500));
      const batch = syms.slice(i, i + 5), res = await Promise.allSettled(batch.map(s => fetchQuote(s, key)));
      res.forEach((r, j) => {
        const s = batch[j];
        if (r.status === 'rejected') { err = err || r.reason; miss.push(s); return; }
        if (!r.value) { miss.push(s); return; }
        if (r.value.denied) { miss.push(s); denied.push(s); return; }
        ok++;
        map.get(s).forEach(({ a, h }) => { h.price = r.value.c; h.dayChg = r.value.d; h.dayPct = r.value.dp; h.quoteAt = r.value.t; touched.add(a); });
      });
      if (err && (err.code === 'key' || err.code === 'limit')) break;
    }
  } finally { quoting = false; }
  touched.forEach(a => { a.updated = todayISO(); });
  if (ok) S.settings.lastQuote = Date.now();
  commit();
  const code = err && err.code;
  if (code === 'key' || (!ok && denied.length && denied.length === syms.length)) return toast(code === 'key' ? 'Finnhub says the key is invalid (error 401). Re-copy it from your Finnhub dashboard.' : 'Finnhub refused every ticker (error 403). The key may be wrong, or these holdings aren\u2019t on the free plan.');
  if (code === 'limit') return toast('Finnhub\u2019s rate limit was reached. Try again in a minute.');
  if (err && !ok) return toast('Couldn\u2019t reach Finnhub. Check your connection and try again.');
  if (opts.silent && !miss.length) return;
  const m = miss.filter(s => !s.startsWith('BINANCE:')).concat(miss.filter(s => s.startsWith('BINANCE:')).map(s => s.slice(8).replace(/USDT$/, '')));
  toast(`Updated ${ok} price${ok === 1 ? '' : 's'}` + (m.length ? `. No live price for ${m.slice(0, 3).join(', ')}${m.length > 3 ? ' and ' + (m.length - 3) + ' more' : ''}; ${m.length === 1 ? 'it keeps' : 'they keep'} the price you entered.` : ''));
}

function parseCsv(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }

}

  return card('Suggested budgets', `<div class="sm mute" style="margin:-4px 0 6px">Based on what you actually spent over the last ${s.months === 1 ? 'month' : s.months + ' months'}, rounded up a little.</div><div class="list">${s.list.map(x => `<div class="li"><span class="ic">${I(x.c.icon)}</span><span class="main"><span class="t">${esc(x.c.name)}</span><span class="s">Averaging ${money(x.avg)} a month, budget ${x.cur ? money(x.cur) : 'not set'}</span></span><span class="amt">${money(x.sug)}<div style="margin-top:4px"><button class="chip" data-act="sugApply" data-id="${x.c.id}" data-v="${x.sug}">Use</button></div></span></div>`).join('')}</div><button class="btn block" style="margin-top:10px" data-act="sugApplyAll">Use all suggestions</button>${tk ? `<div class="xs ${tot > tk ? 'neg' : 'mute'}" style="margin-top:8px">With these, your monthly budgets total ${money(tot)} against ${money(tk)} take-home${tot > tk ? '. That\u2019s more than you bring home, so trim a Wants category.' : ', leaving ' + money(tk - tot) + ' to save.'}</div>` : ''}`);
}

/* ---------- category trends & monthly report ---------- */
function trendsHtml() {

function openReport(off = -1) {
  const m = monthRange(off), pm = monthRange(off - 1), d0 = pd(m.s), name = MONTHS[d0.getMonth()] + ' ' + d0.getFullYear();
  const tx = S.txns.filter(t => inRange(t.date, m)), ptx = S.txns.filter(t => inRange(t.date, pm));
  const incL = sum(tx.filter(t => t.type === 'income').map(t => num(t.amount))), spend = sum(tx.filter(t => t.type === 'expense').map(t => num(t.amount)));
  const pSpend = sum(ptx.filter(t => t.type === 'expense').map(t => num(t.amount)));
  const planned = !incL, inc = incL || calcPay().net / 12, saved = inc - spend, rate = inc ? saved / inc : 0;
  const cats = S.cats.map(c => ({ c, v: spentIn(c.id, m), pv: spentIn(c.id, pm) })).filter(x => x.v > .5 || x.pv > .5).sort((a, b) => b.v - a.v);
  const bud = S.cats.filter(c => num(c.budget) > 0).map(c => ({ c, v: spentIn(c.id, m), b: num(c.budget) }));
  const under = bud.filter(x => x.v <= x.b + .5), over = bud.filter(x => x.v > x.b + .5);
  const big = tx.filter(t => t.type === 'expense' && num(t.amount) > 0).sort((a, b) => num(b.amount) - num(a.amount)).slice(0, 3);
  const hv = e => { const k = Object.keys(S.history).filter(d => d <= e).sort().pop(); return k ? S.history[k] : null; };
  const nw1 = hv(m.e), nw0 = hv(pm.e);
  const html = sheetHead(name + ' report', 'Done') + `<div class="row" style="margin:-4px 0 12px"><button class="chip" data-act="report" data-m="${off - 1}">\u2039 ${MONTHS[pd(pm.s).getMonth()]}</button>${off < 0 ? `<button class="chip" data-act="report" data-m="${off + 1}">${MONTHS[pd(monthRange(off + 1).s).getMonth()]} \u203a</button>` : '<span></span>'}</div>
  <section class="card hero"><div class="mute sm">You ${saved >= 0 ? 'saved' : 'overspent by'}</div><div class="big ${saved < 0 ? 'neg' : ''}">${money(Math.abs(saved))}</div><div class="sm" style="margin-top:4px">${saved >= 0 ? `A <b>${pct(rate, 0)}</b> savings rate` : 'Spending was more than income'}${planned ? ' <span class="mute">(using your planned take-home, since no income was logged)</span>' : ''}</div><div class="grid3" style="margin-top:12px">${stat(planned ? 'Take-home' : 'Income', compact(inc), 'pos')}${stat('Spent', compact(spend))}${stat('vs last month', pSpend ? (spend >= pSpend ? '+' : '\u2212') + pct(Math.abs(spend - pSpend) / pSpend, 0) : '\u2013', spend > pSpend ? 'neg' : 'pos')}</div></section>
  <section class="card" style="margin-top:12px"><h2><span>Where it went</span></h2>${cats.length ? `<div class="list">${cats.slice(0, 6).map(x => { const d = x.pv > 1 ? (x.v - x.pv) / x.pv : null; return `<div class="row sm" style="padding:7px 0;border-top:1px solid var(--line)"><span>${esc(x.c.name)}</span><span><b>${money(x.v)}</b>${d == null ? '' : ` <span class="${d > .05 ? 'neg' : d < -.05 ? 'pos' : 'mute'}">${d > 0 ? '+' : ''}${(d * 100).toFixed(0)}%</span>`}</span></div>`; }).join('')}</div>` : '<div class="sm mute">No spending logged this month.</div>'}</section>
  ${bud.length ? `<section class="card" style="margin-top:12px"><h2><span>Budgets</span><small>${under.length} of ${bud.length} kept</small></h2>${bar(under.length / bud.length, 'var(--pos)')}${over.length ? `<div class="sm" style="margin-top:8px">Over: ${over.map(x => `${esc(x.c.name)} <span class="neg">+${money(x.v - x.b)}</span>`).join(', ')}</div>` : '<div class="sm pos" style="margin-top:8px">Every budget held. Nice work.</div>'}</section>` : ''}
  ${big.length ? `<section class="card" style="margin-top:12px"><h2><span>Biggest purchases</span></h2>${big.map(t => `<div class="row sm" style="padding:6px 0;border-top:1px solid var(--line)"><span>${esc(t.note || catById(t.cat).name)} <span class="mute">${fmtShort(t.date)}</span></span><b>${money(t.amount)}</b></div>`).join('')}</section>` : ''}
  ${nw1 != null && nw0 != null ? `<section class="card" style="margin-top:12px"><div class="row"><span>Net worth change</span><b class="${nw1 - nw0 < 0 ? 'neg' : 'pos'}">${money(nw1 - nw0, { sign: true })}</b></div></section>` : ''}`;
  const top = topSheet(); if (top && top._report) top.remove();
  const ov = openSheet(html); ov._report = true;
}

/* ---------- cash-flow calendar ---------- */
function paydaysBetween(s, e) {
  const n = +S.pay.freq || 26, out = [], a = pd(S.pay.anchor || todayISO());
  if (n === 26 || n === 52) { const len = n === 26 ? 14 : 7; const k = Math.floor((s - a) / 864e5 / len); for (let d = addDays(a, k * len); d <= e; d = addDays(d, len)) if (d >= s) out.push(d); }
  else for (let m = new Date(s.getFullYear(), s.getMonth(), 1); m <= e; m = new Date(m.getFullYear(), m.getMonth() + 1, 1)) {
    const days = n === 24 ? [15, daysIn(m)] : [Math.min(a.getDate(), daysIn(m))];
    days.forEach(dd => { const d = new Date(m.getFullYear(), m.getMonth(), dd); if (d >= s && d <= e) out.push(d); });
  }
  return out;
}
function cashEvents(s, e) {
  const map = {}, add = (d, ev) => { const k = iso(d); (map[k] = map[k] || []).push(ev); };
  const c = calcPay(), per = c.n ? c.net / c.n : 0, today = stripTime(new Date()), seenCard = new Set();
  if (num(S.pay.salary)) paydaysBetween(s, e).forEach(d => add(d, { kind: 'pay', label: 'Payday', amt: per }));
  for (let d = new Date(s); d <= e; d = addDays(d, 1)) {
    S.bills.forEach(b => { if (isDue(b, d)) add(d, { kind: b.noLog ? 'cardsub' : 'bill', label: b.name, amt: b.noLog ? 0 : -num(b.amount), show: num(b.amount) }); });
    S.debts.forEach(x => {
      if (!num(x.dueDay) || !(num(x.balance) > 0) || d.getDate() !== Math.min(num(x.dueDay), daysIn(d))) return;
      let amt = num(x.min);
      if (x.type === 'cc') { if (d > today && !seenCard.has(x.id)) { amt = num(x.balance); seenCard.add(x.id); } else if (d > today) amt = num(x.min); }
      add(d, { kind: 'card', label: x.name + ' payment', amt: -amt, show: amt });
    });
  }
  return map;
}
function budCal() {
  const off = UI.calOff || 0, base = new Date(), ms = new Date(base.getFullYear(), base.getMonth() + off, 1), me = new Date(ms.getFullYear(), ms.getMonth() + 1, 0);
  const today = stripTime(new Date()), tomorrow = addDays(today, 1);
  const from = ms < tomorrow ? ms : tomorrow, ev = cashEvents(from, me);
  const checking = S.accounts.filter(a => a.type === 'checking'), start = sum(checking.map(acctValue));
  const proj = {}; let bal = start, low = null;
  if (checking.length && me >= tomorrow) for (let d = new Date(tomorrow); d <= me; d = addDays(d, 1)) { (ev[iso(d)] || []).forEach(x => bal += x.amt); if (d >= ms) { proj[iso(d)] = bal; if (!low || bal < low.v) low = { v: bal, d: new Date(d) }; } }
  if (!UI.calDay || UI.calDay < iso(ms) || UI.calDay > iso(me)) UI.calDay = off === 0 ? iso(today) : iso(ms);
  let h = `<div class="pnav"><button class="ib" data-act="calPrev" aria-label="Previous month">${I('chevL')}</button><div style="text-align:center"><div class="lbl">${MONTHS[ms.getMonth()]} ${ms.getFullYear()}</div>${off ? '<button class="xs" style="color:var(--acc)" data-act="calNow">Back to this month</button>' : ''}</div><button class="ib" data-act="calNext" aria-label="Next month">${I('chevR')}</button></div>`;
  let g = ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(d => `<div class="cw">${d}</div>`).join('') + '<div></div>'.repeat(ms.getDay());
  for (let d = 1; d <= me.getDate(); d++) {
    const dt = new Date(ms.getFullYear(), ms.getMonth(), d), k = iso(dt), es = ev[k] || [];
    const dots = [...new Set(es.map(x => x.kind))].map(kd => `<i class="dt-${kd}"></i>`).join('');
    g += `<button class="cd${k === UI.calDay ? ' on' : ''}${k === iso(today) ? ' today' : ''}" data-act="calDay" data-d="${k}" aria-label="${fmtDate(k)}${es.length ? ', ' + es.length + ' items' : ''}"><span class="n">${d}</span><span class="dots">${dots}</span>${proj[k] != null && !S.settings.hide ? `<em class="${proj[k] < 0 ? 'neg' : ''}">${compactRaw(proj[k])}</em>` : ''}</button>`;
  }
  h += card('', `<div class="calgrid">${g}</div><div class="legend" style="margin-top:10px"><span><i class="dt-pay" style="border-radius:50%"></i>Payday</span><span><i class="dt-bill" style="border-radius:50%"></i>Bill</span><span><i class="dt-card" style="border-radius:50%"></i>Card or loan payment</span><span><i class="dt-cardsub" style="border-radius:50%"></i>Charged to a card</span></div>`);
  const dayEv = ev[UI.calDay] || [];
  h += card(fmtDate(UI.calDay), (dayEv.length ? `<div class="list">${dayEv.map(x => `<div class="li"><span class="ic">${I(x.kind === 'pay' ? 'cash' : x.kind === 'bill' ? 'doc' : x.kind === 'card' ? 'card' : 'repeat')}</span><span class="main"><span class="t">${esc(x.label)}</span><span class="s">${x.kind === 'pay' ? 'Take-home pay' : x.kind === 'bill' ? 'Bill from checking' : x.kind === 'card' ? 'Paid from checking' : 'On your card, paid when the card is paid'}</span></span><span class="amt ${x.amt > 0 ? 'pos' : x.kind === 'cardsub' ? 'mute' : ''}">${x.amt > 0 ? money(x.amt, { sign: true }) : money(-(x.show || 0))}</span></div>`).join('')}</div>` : '<div class="sm mute">Nothing scheduled.</div>') + (proj[UI.calDay] != null ? `<div class="row sm" style="margin-top:10px"><span class="mute">Projected checking balance</span><b class="${proj[UI.calDay] < 0 ? 'neg' : ''}">${money(proj[UI.calDay])}</b></div>` : ''));
  if (!checking.length) h += card('', '<div class="sm mute">Add a checking account in Invest to project your balance day by day.</div>');
  else if (low) {
    const pts = Object.keys(proj).sort();
    AFTER.push(() => lineChart($('#c-cal'), { x: pts.map(k => pd(k).getDate()), series: [{ name: 'Checking', data: pts.map(k => proj[k]), color: 'var(--c1)' }], area: true, zero: true, xFmt: d => MONTHS[ms.getMonth()] + ' ' + d, label: 'Projected checking balance', h: 150 }));
    h += card('Projected checking balance', `<div class="row"><div><div class="sm mute">Lowest point</div><div class="mid ${low.v < 0 ? 'neg' : low.v < 500 ? 'neg' : ''}">${money(low.v)}</div></div><div class="sm" style="text-align:right">${fmtShort(low.d)}<br><span class="mute">starting from ${money(start)} today</span></div></div>${low.v < 0 ? '<div class="sm neg" style="margin-top:8px">You\u2019d dip below zero. Move money in or shift a bill\u2019s date before then.</div>' : ''}<div class="chart" id="c-cal" style="margin-top:10px"></div><div class="xs mute" style="margin-top:6px">Uses your take-home per paycheck, bills that come out of checking, and card and loan payments on their due days (full balance for cards). Everyday spending isn\u2019t included.</div>`);
  }
  return h;
}

/* ---------- statement check ---------- */
function linkedAsOf(d, date) {
  const tx = S.txns.filter(t => t.acct === d.link && (!d.since || t.date > d.since) && t.date <= date);
  return Math.round((num(d.startBal) + sum(tx.filter(t => t.type === 'expense').map(t => num(t.amount))) - sum(tx.filter(t => t.type === 'payment').map(t => num(t.amount)))) * 100) / 100;
}
function stmtForm(d) {
  openForm({
    title: 'Check ' + d.name, intro: 'Enter the numbers from your latest statement. Compound compares them with the running total of your imported transactions.', fields: [
      { k: 'date', label: 'Statement closing date', type: 'date', v: (d.lastStmt || {}).date || '' },
      { k: 'bal', label: 'New balance on the statement', type: 'money', v: '' }
    ], saveLabel: 'Compare',
    onSave: v => {
      if (!v.date || v.bal === '') { toast('Enter the closing date and balance'); stmtForm(d); return; }
      const app = linkedAsOf(d, v.date), diff = Math.round((num(v.bal) - app) * 100) / 100;
      d.lastStmt = { date: v.date, bal: num(v.bal), diff }; save();
      const near = S.txns.filter(t => t.acct === d.link && Math.abs((pd(t.date) - pd(v.date)) / 864e5) <= 4).sort((a, b) => a.date < b.date ? -1 : 1);
      const after = S.txns.filter(t => t.acct === d.link && t.date > v.date);
      const ok = Math.abs(diff) < .01;
      openSheet(sheetHead('Statement check', 'Done') + `<section class="card hero"><div class="mute sm">${fmtDate(v.date)}</div><div class="big ${ok ? 'pos' : 'neg'}">${ok ? 'Matched' : 'Off by ' + money(Math.abs(diff), { force: true })}</div><div class="grid2" style="margin-top:12px">${stat('Statement', money(v.bal, { force: true }))}${stat('Compound', money(app, { force: true }))}</div></section>
      ${ok ? '<p class="sm">Your imported transactions add up exactly to the statement.</p>' : `<section class="card" style="margin-top:12px"><h2><span>What might explain it</span></h2><div class="sm">${diff > 0 ? `The statement is <b>${money(diff, { force: true })} higher</b>. A charge is probably missing: import the dates around ${fmtShort(v.date)}, or check that your starting balance is right.` : `Compound is <b>${money(-diff, { force: true })} higher</b>. A charge may have posted after the closing date, or a credit or payment is missing.`}${after.length ? ` ${after.length} imported transaction${after.length === 1 ? ' is' : 's are'} dated after the closing date and aren\u2019t counted here.` : ''}</div>${near.length ? `<div class="xs mute" style="margin:10px 0 4px">Transactions near the closing date</div>${near.map(t => `<div class="row sm" style="padding:5px 0;border-top:1px solid var(--line)"><span>${fmtShort(t.date)} ${esc(t.note || '')}</span><b>${t.type === 'payment' ? money(-num(t.amount), { force: true }) : money(num(t.amount), { force: true })}</b></div>`).join('')}` : ''}</section>`}
      <div class="stack" style="gap:8px;margin-top:12px"><button class="btn ${ok ? 'ghost' : ''} block" data-act="stmtAnchor" data-id="${d.id}" data-bal="${num(v.bal)}" data-date="${v.date}">Use this statement as the starting point</button></div><div class="xs mute" style="margin-top:6px">That sets the starting balance to ${money(v.bal, { force: true })} and counts only transactions after ${fmtShort(v.date)}, so the running total matches your statement from here on.</div>`);
    }
  });
}

/* ---------- rules ---------- */
function ruleFor(note) { const n = String(note || '').toLowerCase(); return rules().find(r => r.text && n.includes(r.text.toLowerCase()) && S.cats.some(c => c.id === r.cat)); }
function rulesHtml() {
  return sheetHead('Auto-categorize rules', 'Done') + `<p class="sm mute" style="margin:-4px 0 12px">Rules run first on every import. If a description contains the text, the transaction goes to that category.</p>` +
    (rules().length ? `<div class="list">${rules().map(r => `<button class="li" data-act="editRule" data-id="${r.id}"><span class="ic">${I(catById(r.cat).icon)}</span><span class="main"><span class="t">Contains \u201c${esc(r.text)}\u201d</span><span class="s">Goes to ${esc(catById(r.cat).name)}</span></span></button>`).join('')}</div>` : '<div class="empty">No rules yet. Example: anything containing UBER goes to Transportation.</div>') +
    `<div class="stack" style="gap:8px;margin-top:12px"><button class="btn block" data-act="addRule">Add rule</button>${rules().length ? '<button class="btn ghost block" data-act="applyRules">Apply rules to existing transactions</button>' : ''}</div>`;
}
function openRules() { const ov = openSheet(rulesHtml()); ov._rules = true; }
function refreshRules() { $$('#sheets .ov').forEach(ov => { if (ov._rules) ov.querySelector('.sheet').innerHTML = '<div class="grab"></div>' + rulesHtml(); }); }
function ruleForm(r, pre = {}) {

  openForm({

      { k: 'cat', label: 'Put it in', type: 'select', opts: catOpts(), v: r.cat }
    ], saveLabel: isNew ? 'Add rule' : 'Save rule',

  });
}

/* ---------- card alerts ---------- */
function nextDueDay(day) { const t = stripTime(new Date()); let d = new Date(t.getFullYear(), t.getMonth(), Math.min(day, daysIn(t))); if (d < t) { const n = new Date(t.getFullYear(), t.getMonth() + 1, 1); d = new Date(n.getFullYear(), n.getMonth(), Math.min(day, daysIn(n))); } return d; }
function extraAlerts() {
  const out = [], t = stripTime(new Date());
  S.debts.forEach(d => {
    if (num(d.dueDay) && num(d.balance) > 0) { const due = nextDueDay(num(d.dueDay)), n = Math.round((due - t) / 864e5); if (n <= 5) out.push({ t: `${d.name} payment is due ${n === 0 ? 'today' : n === 1 ? 'tomorrow' : 'in ' + n + ' days'} (${fmtShort(due)}). ${d.type === 'cc' ? 'Balance' : 'Minimum'} ${money(d.type === 'cc' ? d.balance : d.min)}.`, act: 'goDebt' }); }
    if (d.type === 'cc' && num(d.limit) > 0) { const u = num(d.balance) / num(d.limit); if (u > .3) out.push({ t: `${d.name} is using ${pct(u, 0)} of its limit. Keeping it under 30% helps your credit score.`, act: 'goDebt' }); }
  });
  const subs = detectSubs(); if (subs.length) out.push({ t: `Found ${subs.length} repeating charge${subs.length === 1 ? '' : 's'} in your imports that look like subscriptions.`, info: true, act: 'goBills' });
  if (t.getDate() <= 7 && S.txns.some(x => inRange(x.date, monthRange(-1)))) out.push({ t: `Your ${MONTHS[pd(monthRange(-1).s).getMonth()]} report is ready.`, info: true, act: 'report' });
  return out;
}

/* ---------- actions ---------- */
Object.assign(ACT, {
  undo: () => undoLast(),
  backup: () => { closeAll(); backupForm(); },
  restore: () => restoreForm(),
  applyUpdate: () => applyUpdate(),
  dismissUpd: () => { $('#upd').hidden = true; },
  report: d => openReport(d.m != null && d.m !== '' ? +d.m : -1),
  calPrev: () => { UI.calOff = (UI.calOff || 0) - 1; render(); },
  calNext: () => { UI.calOff = (UI.calOff || 0) + 1; render(); },
  calNow: () => { UI.calOff = 0; render(); },
  calDay: d => { UI.calDay = d.d; render(); },
  subAdd: d => {
    const s = detectSubs().find(x => x.key === d.k); if (!s) return;
    checkpoint();
    S.bills.push({ id: uid(), name: s.name, amount: s.amount, cat: s.cat, freq: s.freq, day: s.day, month: s.month, anchor: s.lastDate, sub: true, noLog: s.card, start: todayISO(), last: todayISO(), detected: true });
    commit(); offerUndo(`${s.name} added to subscriptions`);
  },
  subIgnore: d => { checkpoint(); S.settings.subDismiss = [...(S.settings.subDismiss || []), d.k]; commit(); offerUndo('Hidden'); },
  sugApply: d => { const c = S.cats.find(x => x.id === d.id); if (!c) return; checkpoint(); c.budget = +d.v; commit(); offerUndo(`${c.name} budget set to ${money(+d.v, { force: true })}`); },
  sugApplyAll: () => { checkpoint(); budgetSuggestions().list.forEach(x => { x.c.budget = x.sug; }); commit(); offerUndo('Budgets updated'); },
  splitTx: d => { const t = S.txns.find(x => x.id === d.id); if (!t) return; closeSheet(); splitSheet(t); },

/* ---------- safe to spend ---------- */
function safeToSpend() {
  const p = period(0), t = stripTime(new Date()), end = pd(p.e);
  const cats = S.cats.filter(c => c.bucket !== 'savings' && num(c.budget) > 0); if (!cats.length) return null;
  const ids = new Set(cats.map(c => c.id)), days = Math.max(1, Math.round((end - t) / 864e5) + 1);
  const left0 = sum(cats.map(c => { const a = catAvail(c, 0); return Math.max(0, a.avail - a.spent); }));
  let reserve = 0;
  S.bills.forEach(b => { if (b.noLog || !ids.has(b.cat)) return; for (let d = addDays(t, 1); d <= end; d = addDays(d, 1)) if (isDue(b, d)) reserve += num(b.amount); });
  const left = Math.max(0, left0 - reserve);
  return { perDay: left / days, left, days, end, reserve };
}

/* ---------- no-spend ---------- */
function noSpendInfo() {
  const want = new Set(S.cats.filter(c => c.bucket === 'wants').map(c => c.id)), spendDays = new Set(); let first = null;
  S.txns.forEach(t => { if (t.type !== 'expense') return; if (!first || t.date < first) first = t.date; if (catParts(t).some(([c, a]) => want.has(c) && a > 0)) spendDays.add(t.date); });
  if (!first) return null;
  const t = stripTime(new Date()), start = pd(first);
  let streak = 0; for (let d = new Date(t); d >= start; d = addDays(d, -1)) { if (spendDays.has(iso(d))) break; streak++; }
  let best = 0, run = 0; for (let d = new Date(Math.max(start, addDays(t, -365))); d <= t; d = addDays(d, 1)) { if (spendDays.has(iso(d))) run = 0; else best = Math.max(best, ++run); }
  const m = monthRange(0); let mDays = 0;
  for (let d = pd(m.s); d <= t; d = addDays(d, 1)) if (d >= start && !spendDays.has(iso(d))) mDays++;
  const week = [6, 5, 4, 3, 2, 1, 0].map(i => { const d = addDays(t, -i); return { d, ok: d >= start && !spendDays.has(iso(d)), pre: d < start }; });
  const since = iso(addDays(t, -90)), span = Math.max(1, Math.min(91, Math.round((t - start) / 864e5) + 1));
  const w = sum(S.txns.filter(x => x.type === 'expense' && x.date >= since).map(x => sum(catParts(x).filter(([c]) => want.has(c)).map(([, a]) => a))));
  const spendN = [...spendDays].filter(d => d >= since).length || 1, perSpendDay = w / spendN;
  return { streak, best, mDays, week, saved: perSpendDay * mDays * (1 - spendDays.size / Math.max(span, 1)), perSpendDay };
}

function actualYearlySpend() {

    ], saveLabel: 'Suggest a split',

function bonusPlan(net, funPct) {
  const out = [], fun = Math.round(net * funPct) / 100; let left = net - fun;
  const add = (label, cap, kind, ref) => { const v = Math.min(left, Math.max(0, cap)); if (v >= 1) { out.push({ label, v: Math.round(v * 100) / 100, kind, ref }); left -= v; } };
  const needs = needsMonthly(), ef = efTotal(), efm = num(S.settings.efMonths) || 6, L = limitsInfo(), th = num(S.settings.threshold);
  if (needs > 0 && ef < needs) add('Emergency fund, first month', needs - ef, 'ef');
  S.debts.filter(d => num(d.balance) > 0 && num(d.apr) > th).sort((a, b) => num(b.apr) - num(a.apr)).forEach(d => add('Pay down ' + d.name, num(d.balance), 'debt', d.id));
  if (needs > 0 && ef < needs * efm) add('Emergency fund', needs * efm - Math.max(ef, needs), 'ef');
  if (L.ira.has) add('Roth IRA', L.ira.limit - L.ira.ytd, 'ira');
  if (L.hsa.has) add('HSA', L.hsa.limit - L.hsa.ytd, 'hsa');
  S.goals.filter(g => num(g.target) > num(g.saved)).sort((a, b) => (a.due || '9') < (b.due || '9') ? -1 : 1).forEach(g => add(g.name + ' goal', num(g.target) - num(g.saved), 'goal', g.id));
  add('Invest in your brokerage', left, 'broker');
  if (fun >= 1) out.push({ label: 'Just for you', v: fun, kind: 'fun' });
  return out;
}
function bonusResult(v) {

  if (v.kind === 'bonus' && v.gross) { const st = calcPay(); net = net * (1 - .22 - .0765 - (st.G ? st.stax / st.G : 0)); }
  net = Math.round(net * 100) / 100;
  const plan = bonusPlan(net, num(v.fun)), cols = { ef: 'var(--pos)', debt: 'var(--neg)', ira: 'var(--c1)', hsa: 'var(--c5)', goal: 'var(--c3)', broker: 'var(--c2)', fun: 'var(--c6)' };
  UI.bonus = { net, plan, kind: v.kind };
  openSheet(sheetHead('Suggested split', 'Done') + `<section class="card hero"><div class="sm mute">${v.kind === 'refund' ? 'Tax refund' : v.kind === 'bonus' ? 'Bonus' : 'Windfall'}${v.gross ? ', after estimated taxes' : ''}</div><div class="big">${money(net)}</div><div class="split" style="margin-top:12px">${plan.map(p => `<i style="width:${p.v / net * 100}%;background:${cols[p.kind]}"></i>`).join('')}</div></section><section class="card" style="margin-top:12px"><div class="list">${plan.map(p => `<div class="li"><span class="dotc" style="background:${cols[p.kind]}"></span><span class="main"><span class="t">${esc(p.label)}</span></span><span class="amt">${money(p.v)}<div class="xs mute">${pct(p.v / net, 0)}</div></span></div>`).join('')}</div></section><button class="btn block" style="margin-top:12px" data-act="bonusRecord">Record it in Compound</button><div class="xs mute" style="margin-top:6px">Recording adds the income, lowers the debts, and adds to your emergency fund, IRA, HSA, goals and brokerage balances. You still move the money at your bank. You can undo right after.</div>`);
}
function bonusRecord() {
  const B = UI.bonus; if (!B) return; checkpoint(); const today = todayISO(), miss = [];
  S.txns.push({ id: uid(), date: today, amount: B.net, type: 'income', src: B.kind === 'refund' ? 'other' : 'bonus', note: B.kind === 'refund' ? 'Tax refund' : B.kind === 'bonus' ? 'Bonus' : 'Windfall' });
  const acct = t => S.accounts.find(a => a.type === t), bump = (a, v) => { a.cash = num(a.cash) + v; a.updated = today; };
  B.plan.forEach(p => {
    if (p.kind === 'debt') { const d = S.debts.find(x => x.id === p.ref); if (!d) return; if (d.link) S.txns.push({ id: uid(), date: today, amount: p.v, type: 'payment', acct: d.link, note: 'Extra payment' }); else d.balance = Math.max(0, num(d.balance) - p.v); }
    else if (p.kind === 'ef') { const a = S.accounts.find(x => x.ef) || acct('savings'); a ? bump(a, p.v) : miss.push('savings'); }
    else if (p.kind === 'ira' || p.kind === 'hsa') { const a = acct(p.kind === 'ira' ? 'roth_ira' : 'hsa'); if (a) { bump(a, p.v); S.contribs.push({ id: uid(), date: today, acct: a.id, amount: p.v, kind: 'you' }); } }
    else if (p.kind === 'goal') { const g = S.goals.find(x => x.id === p.ref); if (g) g.saved = num(g.saved) + p.v; }
    else if (p.kind === 'broker') { const a = acct('brokerage'); a ? bump(a, p.v) : miss.push('brokerage'); }
  });
  closeAll(); commit(); offerUndo('Recorded' + (miss.length ? `. Add a ${miss.join(' and ')} account to track that part.` : ''));
}

/* ---------- quick add ---------- */
function quickAdd(pre = {}) {
  const recent = [], seen = new Set();
  S.txns.filter(t => t.type === 'expense' && t.note && num(t.amount) > 0 && !t.bill).sort((a, b) => a.date < b.date ? 1 : -1).forEach(t => { const k = merchKey(t.note); if (!seen.has(k) && recent.length < 6) { seen.add(k); recent.push(t); } });
  const cnt = {}; S.txns.slice(-300).forEach(t => { if (t.type === 'expense' && t.cat) cnt[t.cat] = (cnt[t.cat] || 0) + 1; });
  const cats = S.cats.filter(c => c.name !== 'Uncategorized' && c.bucket !== 'savings').sort((a, b) => (cnt[b.id] || 0) - (cnt[a.id] || 0)).slice(0, 8);
  const ov = openSheet(sheetHead('Quick expense', 'Cancel') + `<div class="qa-amt"><span>$</span><input id="qaAmt" type="text" inputmode="decimal" placeholder="0.00" value="${esc(pre.amount || '')}" aria-label="Amount" autocomplete="off"></div><div class="fld" style="margin-bottom:8px"><input id="qaNote" type="text" placeholder="What was it? (optional)" value="${esc(pre.note || '')}" aria-label="Description" autocomplete="off"></div>${recent.length ? `<div class="qa-chips">${recent.map(t => `<button class="chip" data-act="qaRecent" data-id="${t.id}">${esc(prettyName(t.note))}</button>`).join('')}</div>` : ''}<div class="xs mute" style="margin:12px 0 6px">Tap a category to save</div><div class="qa-cats">${cats.map(c => `<button data-act="qaSave" data-cat="${c.id}">${I(c.icon)}<span>${esc(c.name)}</span></button>`).join('')}</div><button class="btn ghost block" style="margin-top:12px" data-act="qaMore">Income, paycheck, bonus and more</button>`);
  ov._qa = true; setTimeout(() => { const i = $('#qaAmt', ov); if (i) i.focus(); }, 280);
}
function qaSave(cat, noteOver) {
  const ov = topSheet(); if (!ov || !ov._qa) return;
  const amt = Math.round(num($('#qaAmt', ov).value) * 100) / 100, note = noteOver != null ? noteOver : $('#qaNote', ov).value.trim();
  if (!(amt > 0)) { toast('Enter the amount first'); $('#qaAmt', ov).focus(); return; }
  checkpoint(); S.txns.push({ id: uid(), date: todayISO(), amount: amt, type: 'expense', cat, note });
  closeSheet(); commit();
  const c = catById(cat), a = catAvail(c, 0), left = a.avail - a.spent;
  offerUndo(`${money(amt, { force: true })} to ${c.name}. ` + (num(c.budget) ? (left >= 0 ? `${money(left, { force: true })} left this period.` : `${money(-left, { force: true })} over budget.`) : ''));
}

/* ---------- year in review & tax export ---------- */
function yearData(y) {
  const r = { s: y + '-01-01', e: y + '-12-31' }, tx = S.txns.filter(t => inRange(t.date, r));
  const inc = sum(tx.filter(t => t.type === 'income').map(t => num(t.amount))), spend = sum(tx.filter(t => t.type === 'expense').map(t => num(t.amount)));
  const months = MONTHS.map((m, i) => { const mr = { s: iso(new Date(y, i, 1)), e: iso(new Date(y, i + 1, 0)) }; return sum(S.txns.filter(t => t.type === 'expense' && inRange(t.date, mr)).map(t => num(t.amount))); });
  const cats = S.cats.map(c => ({ c, v: spentIn(c.id, r) })).filter(x => x.v > .5).sort((a, b) => b.v - a.v);
  const cs = S.contribs.filter(c => inRange(c.date, r)), byT = types => sum(cs.filter(c => { const a = S.accounts.find(x => x.id === c.acct); return a && types.includes(a.type); }).map(c => num(c.amount)));
  const contrib = { k401: byT(['k401', 'roth401k']), match: sum(cs.filter(c => c.kind === 'employer').map(c => num(c.amount))), ira: byT(['roth_ira']), hsa: byT(['hsa']) };
  const health = S.cats.filter(c => /health|medical|pharm|dental|vision/i.test(c.name)).map(c => c.id);
  const hsaExp = tx.filter(t => t.type === 'expense' && catParts(t).some(([c]) => health.includes(c)));
  const charity = tx.filter(t => t.type === 'expense' && (/charit|donat|giving|tithe|church|red cross|united way|goodwill/i.test(t.note || '') || /charit|donat|giving|tithe/i.test(catById(t.cat).name)));
  const hk = Object.keys(S.history).filter(d => d >= r.s && d <= r.e).sort();
  const debtPaid = sum(tx.filter(t => t.type === 'payment').map(t => num(t.amount)));
  const subs = sum(S.bills.filter(b => b.sub).map(billMonthly)) * 12;
  return { y, inc, spend, months, cats, contrib, hsaExp, charity, nw0: hk.length ? S.history[hk[0]] : null, nw1: hk.length ? S.history[hk[hk.length - 1]] : null, hkN: hk.length, debtPaid, subs, n: tx.length };
}
function openYear(y) {
  y = y || new Date().getFullYear(); const d = yearData(y), planned = !d.inc;
  const firstTx = S.txns.filter(t => t.date.startsWith(y + '-')).reduce((m, t) => t.date < m ? t.date : m, y + '-12-31'), lastD = y === new Date().getFullYear() ? new Date() : new Date(y, 11, 31);
  const trackedMonths = Math.max(1, (lastD.getFullYear() - pd(firstTx).getFullYear()) * 12 + lastD.getMonth() - pd(firstTx).getMonth() + 1);
  const inc = d.inc || calcPay().net / 12 * Math.min(12, trackedMonths), saved = inc - d.spend;
  const maxM = d.months.indexOf(Math.max(...d.months)), years = [...new Set(S.txns.map(t => +t.date.slice(0, 4)))].sort();
  const top = topSheet(); if (top && top._year) top.remove();
  const ov = openSheet(sheetHead(y + ' in review', 'Done') + `${years.length > 1 ? `<div class="segwrap">${seg('yearPick', years.map(v => [String(v), String(v)]), String(y))}</div>` : ''}
  <section class="card hero"><div class="sm mute">${y === new Date().getFullYear() ? 'So far this year' : 'For the year'}, you ${saved >= 0 ? 'kept' : 'overspent by'}</div><div class="big ${saved < 0 ? 'neg' : 'pos'}">${money(Math.abs(saved), { whole: true })}</div><div class="sm">${inc ? `A <b>${pct(Math.max(0, saved) / inc, 0)}</b> savings rate` : ''}${planned ? ` <span class="mute">(using planned take-home for the ${trackedMonths} month${trackedMonths === 1 ? '' : 's'} you\u2019ve tracked, since no income was logged)</span>` : ''}</div><div class="grid3" style="margin-top:12px">${stat(planned ? 'Take-home' : 'Income', compact(inc), 'pos')}${stat('Spent', compact(d.spend))}${stat('Net worth', d.nw0 != null && d.nw1 != null && d.hkN > 1 ? (d.nw1 - d.nw0 >= 0 ? '+' : '\u2212') + compact(Math.abs(d.nw1 - d.nw0)) : '\u2013', d.nw1 - d.nw0 < 0 ? 'neg' : 'pos')}</div></section>
  <section class="card" style="margin-top:12px"><h2><span>Spending by month</span>${d.spend ? `<small>highest: ${MONTHS[maxM]}</small>` : ''}</h2><div class="chart" id="c-yr"></div></section>
  ${d.cats.length ? `<section class="card" style="margin-top:12px"><h2><span>Top categories</span></h2>${d.cats.slice(0, 6).map(x => `<div class="row sm" style="padding:6px 0;border-top:1px solid var(--line)"><span>${esc(x.c.name)}</span><span><b>${money(x.v, { whole: true })}</b> <span class="mute">${pct(x.v / d.spend, 0)}</span></span></div>`).join('')}</section>` : ''}
  <section class="card" style="margin-top:12px"><h2><span>Wins</span></h2><div class="grid2">${stat('Invested (401k, IRA, HSA)', money(d.contrib.k401 + d.contrib.ira + d.contrib.hsa, { whole: true }), 'pos')}${stat('Employer match', money(d.contrib.match, { whole: true }), 'pos')}${stat('Paid toward cards', money(d.debtPaid, { whole: true }))}${stat('Subscriptions a year', money(d.subs, { whole: true }))}</div></section>
  <section class="card" style="margin-top:12px"><h2><span>Tax-time folder</span></h2><div class="sm mute" style="margin-bottom:10px">Everything you\u2019d gather for taxes: retirement and HSA contributions, medical expenses you can pay back from your HSA (${d.hsaExp.length}, ${d.hsaExp.filter(t => t.receipt).length} with receipts), and charitable gifts (${d.charity.length}).</div><div class="stack" style="gap:8px"><button class="btn block" data-act="taxPdf" data-y="${y}">Save tax summary as PDF</button><button class="btn ghost block" data-act="taxCsv" data-y="${y}">Export medical and charity items (CSV)</button></div><div class="xs mute" style="margin-top:8px">Your W-2, 1099s and Form 5498-SA come from your employer and providers. This helps you check them.</div></section>`);
  ov._year = true;
  const old = UI.anim; UI.anim = true; barChart($('#c-yr', ov), { labels: MONTHS.map(m => m[0]), values: d.months, colors: d.months.map((_, i) => i === maxM ? 'var(--acc)' : 'var(--c7)'), label: 'Spending by month', h: 150 }); UI.anim = old;
}
function taxPdf(y) {
  const d = yearData(y), f = v => money(v, { force: true }), t = (h, rows) => rows.length ? `<table><tr>${h.map(x => `<th>${x}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map(x => `<td>${x}</td>`).join('')}</tr>`).join('')}</table>` : '<p>None recorded.</p>';
  $('#print').innerHTML = `<h1>${y} tax summary</h1><p>Prepared by Compound on ${fmtDate(new Date())}. Totals come from what was logged or imported in the app. Check them against your W-2, 1099 and 5498 forms.</p>
  <h2>Contributions</h2>${t(['Account', 'Amount'], [['401(k) and Roth 401(k), your contributions', f(d.contrib.k401)], ['Employer match', f(d.contrib.match)], ['Roth IRA', f(d.contrib.ira)], ['HSA, your contributions', f(d.contrib.hsa)]])}
  <h2>Medical expenses (HSA-eligible candidates)</h2>${t(['Date', 'Description', 'Amount', 'Receipt'], d.hsaExp.map(x => [fmtDate(x.date), esc(x.note || catById(x.cat).name), f(x.amount), x.receipt ? `<img src="${x.receipt}" style="max-height:90px">` : 'No']))}<p>Total: ${f(sum(d.hsaExp.map(x => num(x.amount))))}</p>
  <h2>Charitable gifts</h2>${t(['Date', 'Description', 'Amount'], d.charity.map(x => [fmtDate(x.date), esc(x.note || ''), f(x.amount)]))}<p>Total: ${f(sum(d.charity.map(x => num(x.amount))))}</p>
  <h2>Year totals</h2>${t(['Item', 'Amount'], [['Income logged', f(d.inc)], ['Spending', f(d.spend)], ['Card payments', f(d.debtPaid)]])}`;
  closeAll(); setTimeout(() => window.print(), 200);
}
function taxCsv(y) {
  const d = yearData(y), rows = [['Type', 'Date', 'Description', 'Category', 'Amount', 'Has receipt']];
  d.hsaExp.forEach(x => rows.push(['Medical', x.date, x.note || '', catById(x.cat).name, num(x.amount).toFixed(2), x.receipt ? 'Yes' : 'No']));
  d.charity.forEach(x => rows.push(['Charity', x.date, x.note || '', catById(x.cat).name, num(x.amount).toFixed(2), x.receipt ? 'Yes' : 'No']));
  download(`compound-tax-items-${y}.csv`, toCsv(rows), 'text/csv');
}

/* ---------- wire into screens ---------- */
const _planLadder = planLadder;
planLadder = function () { return paydayChecklistHtml(true) + card('Bonus or tax refund?', '<div class="sm mute" style="margin:-4px 0 10px">Get a suggested split that follows these priorities.</div><button class="btn block" data-act="bonus">Split extra money</button>') + _planLadder(); };
const _budOverview = budOverview;
budOverview = function () { return _budOverview() + `<button class="btn ghost block" data-act="year">${new Date().getFullYear()} in review and tax folder</button>`; };
const _planProj = planProj;
planProj = function () { const h = _planProj(), live = LIVE; LIVE = () => { if (live) live(); const el = $('#fiCard'); if (el) el.outerHTML = W.fi().replace('<section class="card', '<section id="fiCard" class="card'); }; return h + W.fi().replace('<section class="card', '<section id="fiCard" class="card') + `<div class="tgl" style="padding:0 4px"><label for="fiAct">Base it on my actual spending${actualYearlySpend() ? ` (${money(actualYearlySpend(), { whole: true })} a year)` : ''}<div class="xs mute">Otherwise uses the yearly spend under Retirement check.</div></label><input type="checkbox" class="sw" id="fiAct" data-bind="settings.fiActual" ${S.settings.fiActual ? 'checked' : ''}></div>`; };

Object.assign(ACT, {
  fab: () => quickAdd(),
  qaMore: () => { closeSheet(); openFab(); },
  qaSave: d => qaSave(d.cat),
  qaRecent: d => { const t = S.txns.find(x => x.id === d.id), ov = topSheet(); if (!t || !ov) return; const note = prettyName(t.note); $('#qaNote', ov).value = note; if (num($('#qaAmt', ov).value) > 0) qaSave(t.cat, note); else { $$('.qa-cats button', ov).forEach(b => b.classList.toggle('on', b.dataset.cat === t.cat)); $('#qaAmt', ov).focus(); } },
  payCheck: d => { S.payChecks = S.payChecks || {}; const l = S.payChecks[d.k] || (S.payChecks[d.k] = []); const i = l.indexOf(d.l); if (i >= 0) l.splice(i, 1); else l.push(d.l); Object.keys(S.payChecks).forEach(k => { if (daysAgo(k) > 60) delete S.payChecks[k]; }); commit(); },
  wiTo: d => { S.settings.whatif.to = d.v; save(); render(); },
  buyGoal: () => { const b = S.settings.buy, r = buyCalc(); checkpoint(); S.goals.push({ id: uid(), name: (b.name || 'Purchase') + (num(b.term) ? ' down payment' : ''), target: Math.round(r.down), saved: num(b.saved), due: r.date ? iso(r.date) : '' }); commit(); offerUndo('Added to your savings goals'); },
  bonus: () => { closeAll(); bonusForm(); },
  bonusRecord: () => bonusRecord(),
  year: () => openYear(),
  yearPick: d => openYear(+d.v),
  taxPdf: d => taxPdf(+d.y),
  taxCsv: d => taxCsv(+d.y)
});
Object.assign(INP, { wiAmt: t => { S.settings.whatif.amt = +t.value; const e = $('#wi-exact'); if (e) e.value = t.value; renderWhatIf(); } });
Object.assign(CHG, { wiDone: () => save() });

const _afterInit3 = afterInit;
afterInit = function () {
  _afterInit3();
  if (!S.settings.v4dash) {
    const d = S.settings.dash, mv = (id, after) => { const i = d.indexOf(id); if (i >= 0) d.splice(i, 1); const j = d.indexOf(after); d.splice(j >= 0 ? j + 1 : d.length, 0, id); };
    mv('safe', 'hero'); mv('payday', 'safe'); mv('nospend', 'budget'); mv('fi', 'retire');
    S.settings.v4dash = true; save(); render();
  }
  const q = new URLSearchParams(location.search);
  if (q.get('add') && S.onboarded) { setTimeout(() => quickAdd({ amount: q.get('amount') || '', note: q.get('note') || '' }), 500); try { history.replaceState(null, '', location.pathname); } catch (e) { } }
  else if (S.settings.quickOnOpen && S.onboarded) setTimeout(() => quickAdd(), 500);
  let hid = 0;
  document.addEventListener('visibilitychange', () => { if (document.hidden) hid = Date.now(); else if (S.settings.quickOnOpen && hid && Date.now() - hid > 10 * 60000 && !$$('#sheets .ov').length) quickAdd(); });
};
